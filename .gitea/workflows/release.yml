name: Production release
on:
  release:
    types: [published]
jobs:
  deploy:
    if: ${{ !gitea.event.release.prerelease && !gitea.event.release.draft }}
    runs-on: sandsphere-macos
    env:
      RELEASE_TAG: ${{ gitea.event.release.tag_name }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          ref: ${{ gitea.event.release.tag_name }}
          fetch-depth: 0
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '24'
      - uses: https://github.com/actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check:version
      - run: npm test
      - run: npm run test:rules
      - run: npm run build:production
      - run: node scripts/release-info.mjs
      - name: Archive the tested build
        run: |
          mkdir -p release
          tar -czf release/sandsphere.tar.gz -C dist .
          shasum -a 256 release/sandsphere.tar.gz > release/SHA256SUMS
      - name: Attach release assets
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_API_URL: ${{ gitea.server_url }}/api/v1
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_RELEASE_ID: ${{ gitea.event.release.id }}
        run: node scripts/upload-release.mjs
      - name: Deploy Firebase security rules and indexes
        run: node scripts/deploy-firebase.mjs
      - name: Deploy sandsphere.app
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then unset CLOUDFLARE_API_TOKEN; fi
          npm run deploy
      - name: Verify sandsphere.app serves this release
        run: node scripts/verify-deployment.mjs
