name: Verify changes

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The full conservation/resume suite exceeds 15 minutes on hosted Linux.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check:version
      - run: npm test
        env:
          PHYSICS_ORACLE_DIAGNOSTICS: '1'
      - run: npm run test:rules
      - run: npm run build
