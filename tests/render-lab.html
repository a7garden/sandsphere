<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sandsphere · 재질 검증</title><style>body{margin:0;background:#080b0d;color:#eee;font:14px system-ui}canvas{display:block;width:100vw;height:100vh;outline:none}nav{display:flex;gap:6px;flex-wrap:wrap}.controls{position:fixed;top:16px;left:20px;right:20px;z-index:2;display:grid;gap:10px}.compare{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.compare span{font-size:12px;color:#a9b6bd;margin-right:6px}.compare button{font-size:12px;padding:7px 10px}.note{margin:0;font-size:12px;color:#a9b6bd;max-width:600px}label{font-size:12px;color:#bfc9cc;display:flex;align-items:center;gap:5px}button{background:#20272b;color:#ddd;border:1px solid #3c4549;padding:9px 14px;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#dde5dc;color:#19251d}output{position:fixed;bottom:20px;left:20px;color:#a9b6bd}</style><div class="controls"><nav aria-label="재질 비교"></nav><div class="compare"><nav aria-label="표면 표현"><span>표면</span><button data-surface="faceted" aria-pressed="false">면이 보이는 로우폴리</button><button data-surface="hexagonal" aria-pressed="true">작은 육각 타일</button><button data-surface="smooth" aria-pressed="false">매끄러운 표면</button></nav><nav aria-label="타일 크기"><span>타일 폭</span><button data-refinement="0" aria-pressed="true">기본 · 2,562</button><button data-refinement="1" aria-pressed="false">½ · 10,242</button><button data-refinement="2" aria-pressed="false">¼ · 40,962</button></nav><nav aria-label="재질 경계"><span>경계</span><button data-boundary="sharp" aria-pressed="false">색 구분</button><button data-boundary="soft" aria-pressed="false">약한 혼합</button><button data-boundary="blend" aria-pressed="true">색 혼합</button></nav><label><input type="checkbox" id="lab-clouds" checked>구름 표시</label></div><nav aria-label="구름 표현"><button data-cloud-style="cumulus" aria-pressed="false">A · 부드러운 입체 구름</button><button data-cloud-style="stratus" aria-pressed="false"
