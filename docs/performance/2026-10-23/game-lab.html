<!doctype html><html lang="ko"><meta charset="utf-8"><title>Sandsphere actual game performance</title>
<style>html,body{margin:0;height:100%;background:#111;color:white;font:13px system-ui}iframe{border:0;width:100%;height:100%}aside{position:fixed;top:56px;right:8px;z-index:100;background:#111e;padding:8px;max-width:32%;max-height:24%;overflow:auto}button{padding:8px}pre{white-space:pre-wrap}</style>
<iframe title="실제 Sandsphere 게임" src="/?test=1&cpu=1"></iframe><aside><button disabled>15초 프레임 측정</button><pre>게임 준비 중</pre></aside>
<script type="module">
const frame=document.querySelector('iframe'),button=document.querySelector('button'),out=document.querySelector('pre');
const summary=a=>{a=[...a].sort((a,b)=>a-b);return {n:a.length,meanMs:a.reduce((a,b)=>a+b,0)/Math.max(1,a.length),p50Ms:a[Math.floor(a.length*.5)]??null,p95Ms:a[Math.floor(a.length*.95)]??null,p99Ms:a[Math.floor(a.length*.99)]??null,over50ms:a.filter(n=>n>50).length};};
const ready=setInterval(()=>{if(frame.contentWindow.sandsphere){clearInterval(ready);button.disabled=false;out.textContent='게임에서 상태를 선택한 뒤 측정하세요.';}},200);
button.onclick=async()=>{button.disabled=true;out.textContent='15초 측정 중';const w=frame.contentWindow,start=w.sandsphere.stats(),frames=[],long=[],events=[];
 const obs=new w.PerformanceObserver(list=>{for(const e of list.getEntries())long.push({start:e.startTime,duration:e.duration});});obs.observe({type:'longtask'});
 const viewportStart=[innerWidth,innerHeight],viewportChanges=[],resized=()=>viewportChanges.push({at:performance.now(),viewport:[innerWidth,innerHeight]});addEventListener('resize',resized);const begin=performance.now();let previous=begin;await new Promise(resolve=>{const sample=now=>{frames.push(now-previous);previous=now;if(now-begin>=15000)resolve();else requestAnimationFrame(sample);};requestAnimationFrame(sample);});
 obs.disconnect();removeEventListener('resize',resized);const elapsed=performance.now()-begin,end=w.sandsphere.stats(),result={method:'actual application in same-origin iframe, test storage slot, WebGL + CPU Worker; guest; no cloud configuration',viewport:[innerWidth,innerHeight],viewportStart,viewportChanges,drawingBuffer:[w.document.querySelector('canvas').width,w.document.querySelector('canvas').height],dpr:devicePixelRatio,userAgent:navigator.userAgent,wallClock:new Date().toISOString(),elapsedMs:elapsed,start:{time:start.time,paused:start.paused,planets:start.planets.length,backend:start.backend,renderer:start.renderer},end:{time:end.time,paused:end.paused,planets:end.planets.length,clockBacklog:end.clockBacklog,lastSavedAt:end.lastSavedAt},actualGameSecondsPerWallSecond:(end.time-start.time)/(elapsed/1000),frames:summary(frames),longTasks:long,fpsText:w.document.querySelector('#fps')?.textContent,rateText:w.document.querySelector('#game-rate')?.textContent};
 out.textContent=JSON.stringify(result,null,2);await fetch('/__performance/result/game-'+(start.paused?'paused':'running')+'-'+Date.now(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});button.disabled=false;
};
</script></html>
